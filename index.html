<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Problematic Subscription Seller</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Report a Problematic Seller</h1>
      <p class="subtitle">Submit your discounted subscription details to report a problematic seller</p>
    </header>

    <main>
      <form id="report-form" class="report-form">
        <div class="form-group">
          <label for="email">Subscription Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Enter subscription email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Subscription Password</label>
          <input 
            type="text" 
            id="password" 
            name="password" 
            placeholder="Enter subscription password"
            required
          >
        </div>

        <div class="form-group">
          <label for="subscription-type">Subscription Type</label>
          <select id="subscription-type" name="subscription-type" required>
            <option value="" disabled selected>Select subscription</option>
            <option value="ChatGPT">ChatGPT</option>
            <option value="Grok">Grok</option>
            <option value="CapCut">CapCut</option>
          </select>
        </div>

        <div class="form-group">
          <label for="purchase-date">When did you purchase?</label>
          <input 
            type="date" 
            id="purchase-date" 
            name="purchase-date" 
            required
          >
        </div>

        <div class="form-group">
          <label for="issue-date">When did the subscription stop and have issue?</label>
          <input 
            type="date" 
            id="issue-date" 
            name="issue-date" 
            required
          >
        </div>

        <div class="form-group">
          <label for="supplier-username">Seller Username</label>
          <input 
            type="text" 
            id="supplier-username" 
            name="supplier-username" 
            placeholder="Enter the seller's username"
            required
          >
        </div>

        <div class="form-group">
          <label for="platform">Platform</label>
          <select id="platform" name="platform" required>
            <option value="" disabled selected>Select platform</option>
            <option value="Telegram">Telegram</option>
            <option value="Discord">Discord</option>
            <option value="Facebook">Facebook</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Twitter/X">Twitter/X</option>
            <option value="Instagram">Instagram</option>
            <option value="Others">Others</option>
          </select>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">Submit Report</button>
      </form>

      <div id="result-section" class="result-section" style="display: none;">
        <div id="result-content"></div>
      </div>
    </main>

    <footer>
      <p class="footer-text">Report problematic subscription sellers</p>
    </footer>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://soycqmjnjqkmbinzfrnf.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNveWNxbWpuanFrbWJpbnpmcm5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MjkzNzgsImV4cCI6MjA5NDMwNTM3OH0.9dEaN4ZOMZfQtB-547UzlNmfOkzsfuT7Xu9oXOMGTTs'
    );

    const form = document.getElementById('report-form');
    const resultSection = document.getElementById('result-section');
    const resultContent = document.getElementById('result-content');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const subscriptionType = document.getElementById('subscription-type').value;
      const purchaseDate = document.getElementById('purchase-date').value;
      const issueDate = document.getElementById('issue-date').value;
      const supplierUsername = document.getElementById('supplier-username').value.trim();
      const platform = document.getElementById('platform').value;

      if (!email || !password || !subscriptionType || !purchaseDate || !issueDate || !supplierUsername || !platform) {
        showResult('error', 'Please fill in all fields.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        // Check if this email already exists in the system
        const { data: existingReports, error: matchError } = await supabase
          .from('reports')
          .select('*')
          .eq('email', email);

        if (matchError) throw matchError;

        // Insert the new report
        const { data: newReport, error: insertError } = await supabase
          .from('reports')
          .insert([
            {
              email: email,
              password: password,
              subscription_type: subscriptionType,
              purchase_date: purchaseDate,
              issue_date: issueDate,
              supplier_username: supplierUsername,
              platform: platform
            }
          ])
          .select();

        if (insertError) throw insertError;

        // If there are existing matches, show them
        if (existingReports && existingReports.length > 0) {
          let matchHTML = `
            <div class="match-found">
              <h3>Match Found!</h3>
              <p>This subscription has been reported before:</p>
              <table class="match-table">
                <thead>
                  <tr>
                    <th>Email</th>
                    <th>Type</th>
                    <th>Supplier</th>
                    <th>Platform</th>
                    <th>Reported On</th>
                  </tr>
                </thead>
                <tbody>
          `;

          existingReports.forEach(report => {
            const date = new Date(report.created_at).toLocaleDateString();
            matchHTML += `
              <tr>
                <td>${escapeHTML(report.email)}</td>
                <td>${escapeHTML(report.subscription_type || 'N/A')}</td>
                <td>${escapeHTML(report.supplier_username)}</td>
                <td>${escapeHTML(report.platform)}</td>
                <td>${date}</td>
              </tr>
            `;
          });

          matchHTML += `
                </tbody>
              </table>
              <p class="warning-text">This seller has been reported ${existingReports.length} time(s) before your report.</p>
            </div>
          `;

          showResult('match', matchHTML);
        } else {
          showResult('success', `
            <div class="no-match">
              <h3>Report Submitted Successfully</h3>
              <p>Your report has been recorded. This is the first report for this subscription.</p>
              <div class="report-summary">
                <p><strong>Email:</strong> ${escapeHTML(email)}</p>
                <p><strong>Subscription:</strong> ${escapeHTML(subscriptionType)}</p>
                <p><strong>Purchased:</strong> ${purchaseDate}</p>
                <p><strong>Issue Date:</strong> ${issueDate}</p>
                <p><strong>Supplier:</strong> ${escapeHTML(supplierUsername)}</p>
                <p><strong>Platform:</strong> ${escapeHTML(platform)}</p>
              </div>
            </div>
          `);
        }

        form.reset();
      } catch (error) {
        console.error('Error:', error);
        showResult('error', `<p>Something went wrong: ${escapeHTML(error.message)}</p>`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Report';
      }
    });

    function showResult(type, content) {
      resultSection.className = `result-section ${type}`;
      resultContent.innerHTML = content;
      resultSection.style.display = 'block';
      resultSection.scrollIntoView({ behavior: 'smooth' });
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }
  </script>
</body>
</html>
